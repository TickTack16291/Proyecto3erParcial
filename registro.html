<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">
    <title>Registro - El universo</title>
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <div class="nav-left">
                <img src="Logo.png" alt="Logo del proyecto" height="90">
                <a href="index.html">El sistema solar</a>
                <a href="artemis.html">Artemis II</a>
                <a href="apolo.html">Misiones Apolo</a>
                <a href="mexico.html">Mexico y el espacio</a>
            </div>
            <div class="nav-right" id="nav-user">
                <a href="login.html" class="is-active">Iniciar Sesion</a>
            </div>
        </nav>
    </header>
    
    <section id="login-section">
        <div class="login-container">
            <h1>Únete a la tripulación</h1>
            <p>Regístrate para compartir tus descubrimientos</p>
            <form id="registro-form">
                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Neil Armstrong">
                </div>
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">Registrarse</button>
                <p id="registro-message" style="margin-top: 15px;"></p>
            </form>
            <div class="auth-links">
                <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </section>

    <script src="auth.js"></script>
</body>
</html>
